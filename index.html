<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>模型</title>
<style>
  :root { color-scheme: light dark;
    --bg:#fff; --fg:#1c1e21; --fg2:#6b7280; --fg3:#9aa1ab; --bd:#e5e7eb; --hov:#f5f6f8; --card:#fff;
    --blue:#4d6bfe; --ok:#22c55e; --warn:#d97706; --danger:#dc2626; --shadow:0 1px 2px rgba(0,0,0,.04); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161616; --fg:#e8eaed; --fg2:#a0a4ab; --fg3:#787d86; --bd:#2c2c2c; --hov:#1f1f1f; --card:#1c1c1c; --shadow:none; }
  }
  * { box-sizing: border-box; }
  html, body { margin:0; }
  html { background:var(--bg); height:100%; overflow-x:hidden; overscroll-behavior:none; }
  body { background:var(--bg); color:var(--fg); font:14px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; padding:20px 22px 34px; min-height:100%; overflow-x:clip; -webkit-overflow-scrolling:touch; }
  .head { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .head h1 { font-size:24px; font-weight:700; letter-spacing:-.3px; margin:0; }
  .head .sub { font-size:13px; color:var(--fg2); margin-top:2px; }
  .head .actions { display:flex; gap:8px; align-items:center; }
  .btn { font:inherit; font-size:13px; padding:6px 14px; border:1px solid var(--bd); border-radius:999px; background:transparent; color:var(--fg); cursor:pointer; transition:border-color .15s, color .15s, background .15s; }
  .btn:hover { border-color:var(--blue); color:var(--blue); }
  .btn.primary { background:var(--blue); border-color:var(--blue); color:#fff; }
  .btn.primary:hover { filter:brightness(1.08); color:#fff; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap:14px; margin-top:18px; min-width:0; }
  .pcard { background:var(--card); border:1px solid var(--bd); border-radius:14px; padding:16px 16px 14px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:12px; position:relative; transition:border-color .15s; min-width:0; }
  .pcard.active { border-color:color-mix(in srgb, var(--ok) 55%, var(--bd)); }
  .pc-top { display:flex; align-items:center; gap:11px; }
  .avatar { width:40px; height:40px; border-radius:11px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:16px; font-weight:700; flex:none; text-transform:uppercase; }
  .pc-title { min-width:0; flex:1; display:flex; flex-direction:column; overflow:hidden; }
  .pc-name { font-size:15px; font-weight:650; display:flex; align-items:center; gap:6px; min-width:0; }
  .pc-name .t { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .badge { font-size:11px; font-weight:500; color:var(--fg2); background:var(--hov); border:1px solid var(--bd); border-radius:999px; padding:1px 8px; flex:none; white-space:nowrap; }
  .badge.ok { color:var(--ok); border-color:color-mix(in srgb, var(--ok) 45%, var(--bd)); }
  .badge.blue { color:var(--blue); border-color:color-mix(in srgb, var(--blue) 45%, var(--bd)); }
  .pc-url { display:block; width:100%; font-size:12px; color:var(--fg3); font-family:ui-monospace, SFMono-Regular, Consolas, monospace; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rows { display:flex; flex-direction:column; gap:6px; font-size:12.5px; }
  .row { display:flex; gap:8px; min-width:0; }
  .row .k { color:var(--fg3); flex:none; width:62px; }
  .row .v { color:var(--fg); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .v.mono { font-family:ui-monospace, SFMono-Regular, Consolas, monospace; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; min-width:0; }
  .chip { font-size:11.5px; color:var(--fg2); background:var(--hov); border:1px solid var(--bd); border-radius:7px; padding:2px 7px; white-space:nowrap; max-width:100%; overflow:hidden; text-overflow:ellipsis; }
  .chip.vis::after { content:"👁"; margin-left:4px; font-size:10px; }
  .more { font-size:11.5px; color:var(--blue); background:none; border:0; padding:2px 0; cursor:pointer; }
  .pc-foot { display:flex; justify-content:space-between; align-items:center; padding-top:2px; }
  .tools { display:flex; gap:5px; flex-wrap:wrap; }
  .tool { font-size:11px; color:var(--warn); border:1px dashed color-mix(in srgb, var(--warn) 55%, var(--bd)); border-radius:999px; padding:1px 8px; }
  .add { border:1.5px dashed var(--bd); background:transparent; border-radius:14px; min-height:180px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; color:var(--fg2); cursor:pointer; font:inherit; transition:border-color .15s, color .15s, background .15s; }
  .add:hover { border-color:var(--blue); color:var(--blue); background:color-mix(in srgb, var(--blue) 5%, transparent); }
  .add .plus { width:38px; height:38px; border-radius:50%; border:1.5px dashed currentColor; display:flex; align-items:center; justify-content:center; font-size:22px; line-height:1; }
  .add .t { font-size:14px; font-weight:600; }
  .add .s { font-size:12px; color:var(--fg3); }
  .empty, .loading { padding:48px 0; text-align:center; color:var(--fg3); font-size:13px; }
  .foot { margin-top:26px; text-align:center; font-size:12px; color:var(--fg3); }
  .toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:#111; color:#fff; padding:8px 16px; border-radius:999px; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; max-width:80vw; }
  .toast.on { opacity:.94; }
  .toast.err { background:var(--danger); }
  /* modal */
  .mask { position:fixed; inset:0; background:rgba(0,0,0,.42); display:none; align-items:center; justify-content:center; padding:22px; z-index:20; }
  .mask.on { display:flex; }
  .modal { width:min(520px, 100%); max-height:88vh; overflow:auto; background:var(--card); color:var(--fg); border:1px solid var(--bd); border-radius:16px; padding:20px 20px 18px; box-shadow:0 18px 50px rgba(0,0,0,.28); }
  .modal h2 { margin:0 0 4px; font-size:18px; }
  .modal .hint { font-size:12.5px; color:var(--fg2); margin-bottom:14px; }
  .field { display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
  .field label { font-size:12.5px; color:var(--fg2); }
  .field input, .field select, .field textarea { font:inherit; font-size:13px; color:var(--fg); background:var(--bg); border:1px solid var(--bd); border-radius:9px; padding:8px 10px; outline:none; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color:var(--blue); }
  .field textarea { min-height:74px; resize:vertical; font-family:ui-monospace, SFMono-Regular, Consolas, monospace; }
  .field .tip { font-size:11.5px; color:var(--fg3); }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .modal .foot-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }
  @media (max-width:520px) { .two { grid-template-columns:1fr; } }
</style>
</head>
<body>
  <div class="head">
    <div>
      <h1>模型</h1>
      <div class="sub">每个供应商一张卡片 · 数据源：凭据池 credentials.json + 网关 /gateway/models</div>
    </div>
    <div class="actions">
      <button class="btn" id="refresh">刷新</button>
      <button class="btn primary" id="addTop">＋ 新增供应商</button>
    </div>
  </div>
  <div class="grid" id="grid"><div class="loading">加载中…</div></div>
  <div class="foot">写入走网关 /gateway/file/write（带 mtime 冲突校验，写前自动备份）</div>
  <div class="toast" id="toast"></div>

  <div class="mask" id="mask">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
      <h2 id="mTitle">新增供应商</h2>
      <div class="hint">写入 <code>.claude/credentials.json</code> 的 providers。名称在池内必须唯一。</div>
      <div class="field">
        <label for="fName">名称（providers 键名）</label>
        <input id="fName" placeholder="例如 openrouter" autocomplete="off" spellcheck="false">
        <span class="tip">仅字母、数字、下划线、短横线</span>
      </div>
      <div class="field">
        <label for="fUrl">Base URL</label>
        <input id="fUrl" placeholder="https://api.example.com/anthropic" autocomplete="off" spellcheck="false">
      </div>
      <div class="two">
        <div class="field">
          <label for="fProto">协议</label>
          <select id="fProto">
            <option value="anthropic">anthropic（Anthropic Messages）</option>
            <option value="openai-chat">openai-chat（Chat Completions）</option>
          </select>
        </div>
        <div class="field">
          <label for="fKey">API Key</label>
          <input id="fKey" placeholder="sk-..." autocomplete="off" spellcheck="false">
        </div>
      </div>
      <div class="field">
        <label for="fModels">模型列表</label>
        <textarea id="fModels" placeholder="每行一个，或用逗号分隔&#10;model-a&#10;model-b"></textarea>
      </div>
      <div class="field">
        <label for="fActive">默认模型（可留空 = 第一个）</label>
        <input id="fActive" placeholder="model-a" autocomplete="off" spellcheck="false">
      </div>
      <div class="foot-actions">
        <button class="btn" id="cancelAdd">取消</button>
        <button class="btn primary" id="submitAdd">新增</button>
      </div>
    </div>
  </div>

<script>
  const TOKEN = new URLSearchParams(location.search).get('token') || ''
  const ROOT_LABEL = '全局根 · 散装对话'
  const CRED_PATH = '.claude/credentials.json'
  const PALETTE = ['#5b8ff9', '#61a1c2', '#7b6bd6', '#5aa57a', '#d98a4a', '#c96a6a', '#4aa3a0', '#a06ba8', '#6b8f71', '#b48a5a']
  const CHIP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="6.5" y="6.5" width="11" height="11" rx="2"/><path d="M9.5 3.5v3M14.5 3.5v3M9.5 17.5v3M14.5 17.5v3M3.5 9.5h3M3.5 14.5h3M17.5 9.5h3M17.5 14.5h3"/></svg>'
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
  const $ = (id) => document.getElementById(id)
  function api(p) { return p + (TOKEN ? (p.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(TOKEN) : '') }
  function color(n) { let h = 0; for (const c of n) h = (h * 31 + c.charCodeAt(0)) >>> 0; return PALETTE[h % PALETTE.length] }
  let toastTimer = 0
  function toast(msg, isErr) { const t = $('toast'); t.textContent = msg; t.classList.toggle('err', !!isErr); t.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), isErr ? 3600 : 1800) }
  function maskKey(k) { const s = String(k || ''); if (s.length <= 10) return s ? s.slice(0, 3) + '…' : '—'; return s.slice(0, 6) + '…' + s.slice(-4) }

  let CRED = null, CRED_MTIME = 0, MODELS = null, EXPANDED = new Set()

  async function readCredentials() {
    const r = await fetch(api('/gateway/file?label=' + encodeURIComponent(ROOT_LABEL) + '&path=' + encodeURIComponent(CRED_PATH)))
    if (!r.ok) throw new Error('读取凭据池失败：HTTP ' + r.status)
    const etag = r.headers.get('ETag') || ''
    const m = /"?([\d.]+)"?/.exec(etag)
    CRED_MTIME = m ? Number(m[1]) : 0
    const text = await r.text()
    CRED = JSON.parse(text)
  }
  async function readModels() {
    try {
      const r = await fetch(api('/gateway/models'))
      MODELS = r.ok ? await r.json() : null
    } catch { MODELS = null }
  }
  async function load() {
    $('grid').innerHTML = '<div class="loading">加载中…</div>'
    try {
      await Promise.all([readCredentials(), readModels()])
      render()
    } catch (e) {
      $('grid').innerHTML = '<div class="empty">加载失败：' + esc(e.message || e) + '</div>'
    }
  }

  function visionSet() {
    const s = new Set()
    if (MODELS && Array.isArray(MODELS.items)) for (const it of MODELS.items) if (it.vision === true) s.add(it.v)
    return s
  }
  function render() {
    const providers = CRED && CRED.providers ? CRED.providers : {}
    const names = Object.keys(providers)
    if (!names.length) { $('grid').innerHTML = '<div class="empty">凭据池里还没有供应商</div>' ; }
    const vis = visionSet()
    const toolsOf = {}
    if (CRED && CRED.tools && typeof CRED.tools === 'object') {
      for (const [cap, b] of Object.entries(CRED.tools)) if (b && b.provider) (toolsOf[b.provider] = toolsOf[b.provider] || []).push(cap)
    }
    const html = names.map((n) => providerCard(n, providers[n], vis, toolsOf[n] || [])).join('') +
      '<button class="add" id="addCard"><span class="plus">＋</span><span class="t">新增供应商</span><span class="s">填写 base URL / key / 模型，直接写入凭据池</span></button>'
    $('grid').innerHTML = html
    $('addCard').addEventListener('click', openAdd)
    document.querySelectorAll('.more[data-p]').forEach((b) => b.addEventListener('click', () => {
      const p = b.dataset.p
      if (EXPANDED.has(p)) EXPANDED.delete(p); else EXPANDED.add(p)
      render()
    }))
  }
  function providerCard(name, cfg, vis, tools) {
    const active = CRED.activeProvider === name
    const models = Array.isArray(cfg.models) ? cfg.models : []
    const keys = Array.isArray(cfg.keys) ? cfg.keys : []
    const ak = keys[cfg.activeKeyIndex] || keys[0]
    const expand = EXPANDED.has(name)
    const shown = expand ? models : models.slice(0, 8)
    const chips = shown.map((m) => '<span class="chip' + (vis.has(m) ? ' vis' : '') + '" title="' + esc(m) + '">' + esc(m) + '</span>').join('')
    const more = models.length > 8 ? '<button class="more" data-p="' + esc(name) + '">' + (expand ? '收起' : '展开全部 ' + models.length + ' 个') + '</button>' : ''
    const keyState = ak ? (ak.exhausted ? '<span class="badge" style="color:var(--danger)">已耗尽</span>' : '') : ''
    return '<div class="pcard' + (active ? ' active' : '') + '">' +
      '<div class="pc-top">' +
        '<span class="avatar" style="background:' + color(name) + '">' + CHIP + '</span>' +
        '<span class="pc-title"><span class="pc-name"><span class="t">' + esc(name) + '</span>' +
          (active ? '<span class="badge ok">默认</span>' : '') +
          (cfg.protocol === 'openai-chat' ? '<span class="badge">openai-chat</span>' : '<span class="badge">anthropic</span>') +
        '</span><span class="pc-url" title="' + esc(cfg.baseUrl) + '">' + esc(cfg.baseUrl || '—') + '</span></span>' +
      '</div>' +
      '<div class="rows">' +
        '<div class="row"><span class="k">当前模型</span><span class="v mono" title="' + esc(cfg.activeModel) + '">' + esc(cfg.activeModel || '—') + '</span></div>' +
        '<div class="row"><span class="k">密钥</span><span class="v">' + keys.length + ' 把 · <span class="mono">' + esc(maskKey(ak && ak.value)) + '</span> ' + keyState + '</span></div>' +
        '<div class="row"><span class="k">模型数</span><span class="v">' + models.length + ' 个' + (vis.size ? '' : '') + '</span></div>' +
        (Array.isArray(cfg.effortLevels) && cfg.effortLevels.length ? '<div class="row"><span class="k">思考等级</span><span class="v">' + esc(cfg.effortLevels.join(' / ')) + '</span></div>' : '') +
      '</div>' +
      '<div class="chips">' + chips + '</div>' + more +
      '<div class="pc-foot"><span class="tools">' + tools.map((t) => '<span class="tool">工具 · ' + esc(t) + '</span>').join('') + '</span></div>' +
    '</div>'
  }

  function openAdd() {
    $('fName').value = ''; $('fUrl').value = ''; $('fKey').value = ''; $('fModels').value = ''; $('fActive').value = ''; $('fProto').value = 'anthropic'
    $('mask').classList.add('on'); setTimeout(() => $('fName').focus(), 30)
  }
  function closeAdd() { $('mask').classList.remove('on') }

  async function submitAdd() {
    const name = $('fName').value.trim()
    const baseUrl = $('fUrl').value.trim()
    const protocol = $('fProto').value
    const key = $('fKey').value.trim()
    const rawModels = $('fModels').value.split(/[\n,]+/).map((s) => s.trim()).filter(Boolean)
    const models = [...new Set(rawModels)]
    const activeModel = $('fActive').value.trim() || models[0] || ''
    if (!/^[A-Za-z0-9_-]+$/.test(name)) { toast('名称只能用字母、数字、下划线、短横线', true); return }
    if (!baseUrl || !/^https?:\/\//i.test(baseUrl)) { toast('Base URL 需以 http(s):// 开头', true); return }
    if (!key) { toast('API Key 不能为空', true); return }
    if (!models.length) { toast('至少填一个模型', true); return }
    if (activeModel && !models.includes(activeModel)) { toast('默认模型不在模型列表里', true); return }
    if (CRED.providers && CRED.providers[name]) { toast('供应商「' + name + '」已存在', true); return }

    const btn = $('submitAdd'); btn.disabled = true; btn.textContent = '写入中…'
    try {
      // 写前备份当前凭据池（新建文件 + 写入原文）
      const stamp = new Date().toISOString().replace(/[-:T]/g, '').slice(0, 14)
      const bakName = 'credentials.json.bak-' + stamp
      const cr = await fetch(api('/gateway/file/create'), {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ label: ROOT_LABEL, path: '.claude', name: bakName, dir: false }),
      })
      if (cr.ok) {
        await fetch(api('/gateway/file/write'), {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ label: ROOT_LABEL, path: '.claude/' + bakName, content: JSON.stringify(CRED, null, 2) }),
        })
      }
      const next = JSON.parse(JSON.stringify(CRED))
      const cfg = {
        baseUrl,
        keys: [{ value: key, exhausted: false }],
        activeKeyIndex: 0,
        models,
        activeModel,
        modelVision: {},
      }
      if (protocol !== 'anthropic') cfg.protocol = protocol
      next.providers[name] = cfg
      const wr = await fetch(api('/gateway/file/write'), {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ label: ROOT_LABEL, path: CRED_PATH, content: JSON.stringify(next, null, 2), ...(CRED_MTIME ? { baseMtime: CRED_MTIME } : {}) }),
      })
      const d = await wr.json().catch(() => ({}))
      if (!wr.ok) throw new Error(d.error === 'conflict' ? '凭据池已被其它操作修改，请刷新后重试' : (d.error || ('HTTP ' + wr.status)))
      closeAdd()
      toast('已新增供应商 ' + name)
      await load()
    } catch (e) {
      toast('新增失败：' + (e.message || e), true)
    } finally {
      btn.disabled = false; btn.textContent = '新增'
    }
  }

  $('addTop').addEventListener('click', openAdd)
  $('refresh').addEventListener('click', load)
  $('cancelAdd').addEventListener('click', closeAdd)
  $('submitAdd').addEventListener('click', submitAdd)
  $('mask').addEventListener('click', (e) => { if (e.target === $('mask')) closeAdd() })
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('mask').classList.contains('on')) closeAdd() })
  load()
</script>
</body>
</html>
